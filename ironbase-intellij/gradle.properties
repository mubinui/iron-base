# The plugin's own version, independent of the VS Code extension's.
pluginVersion=0.1.0-SNAPSHOT
pluginGroup=dev.ironbase.plugin

# The IDE this is built and tested against. IC = IntelliJ IDEA Community,
# free to depend on and enough for a JVM/Kotlin-facing plugin; nothing here
# needs a language plugin only Ultimate ships.
platformType=IC
platformVersion=2024.2

kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
