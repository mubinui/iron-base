<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A stepped foundation: three solid tiers narrowing as they rise, the base
       widest and heaviest. Solid rather than outlined so it holds its weight at
       the 16px the activity bar renders it at, and monochrome so it takes the
       bar's own foreground colour. -->
  <rect x="8.5" y="4" width="7" height="3.6" rx="1.3" fill="currentColor"/>
  <rect x="6" y="10" width="12" height="3.6" rx="1.3" fill="currentColor"/>
  <rect x="3.5" y="16" width="17" height="4" rx="1.5" fill="currentColor"/>
</svg>
