<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A stepped foundation: three solid tiers narrowing as they rise, the base
       widest and heaviest. Solid rather than outlined so it holds its weight at
       the 16px the activity bar renders it at, and monochrome so it takes the
       bar's own foreground colour.

       The taper is gentle on purpose. A steep pyramid leaves its top two
       corners empty at every size, which reads as a mistake on the Marketplace
       tile that shares these coordinates — see scripts/generate-icon.py. -->
  <rect x="7" y="4" width="10" height="3.9" rx="1.5" fill="currentColor"/>
  <rect x="5" y="10.2" width="14" height="3.9" rx="1.6" fill="currentColor"/>
  <rect x="3.5" y="16.4" width="17" height="4.2" rx="1.8" fill="currentColor"/>
</svg>
